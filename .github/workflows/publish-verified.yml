name: Publish verified artifacts
'on':
  workflow_dispatch:
    inputs:
      validation_run:
        description: Run with all four successful device validation jobs
        required: true
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.repository == 'ghehyoein/IPAkeyboardios'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VALIDATION_RUN: ${{ inputs.validation_run }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Require passing jobs and identical application inputs
      run: |
        python3 - <<'PY'
        import json, os, subprocess, sys
        sys.path.insert(0, 'tools')
        from testflight_simulator import validations_passed
        repo = os.environ['GITHUB_REPOSITORY']
        def api(path):
            return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
        for kind in ('VALIDATION_RUN',):
            run_id = os.environ[kind]
            assert run_id.isdecimal()
            run = api(f'actions/runs/{run_id}')
            assert run['head_repository']['full_name'] == repo and run['head_branch'] == 'main'
            assert run['status'] == 'completed'
            sha = run['head_sha']
            subprocess.run(['git','merge-base','--is-ancestor',sha,'HEAD'],check=True)
            paths = ['App','Shared','KeyboardExtension','IPAKeyboard.xcodeproj','VERSION','tools/generate_project.py','tools/build_catalog.py']
            subprocess.run(['git','diff','--exit-code',sha,'HEAD','--',*paths],check=True)
            jobs = api(f'actions/runs/{run_id}/jobs?filter=latest&per_page=100')['jobs']
            if kind == 'VALIDATION_RUN':
                assert validations_passed(jobs)
                subprocess.run(['git','diff','--exit-code',sha,'HEAD','--','Tests/*.swift'],check=True)
            print(kind, run_id, sha, 'verified')
        PY
    - uses: actions/download-artifact@v4
      with:
        name: unsigned-ipa
        path: build
        github-token: ${{ github.token }}
        run-id: ${{ inputs.validation_run }}
    - name: Verify and publish
      run: |
        (cd build && sha256sum --check SHA256SUMS.txt)
        assets=(build/IPAKeyboard-unsigned.ipa build/SHA256SUMS.txt)
        python3 - <<'PY'
        import plistlib, zipfile
        from pathlib import Path
        with zipfile.ZipFile('build/IPAKeyboard-unsigned.ipa') as z:
            plists = [n for n in z.namelist() if n.endswith('.app/Info.plist') or n.endswith('.appex/Info.plist')]
            assert len(plists) == 2
            for path in plists:
                p = plistlib.loads(z.read(path))
                assert p['CFBundleShortVersionString'] == Path('VERSION').read_text().strip()
                assert p['MinimumOSVersion'] == '17.0' and set(p['UIDeviceFamily']) == {1,2}
                assert p['CFBundleDisplayName'] == 'ipa+ keyboard'
        PY
        cat > build/RELEASE.md <<NOTES
        Long-press the symbol category strip to see one representative phonetic symbol per category instead of crowded text. Representatives belong to their own categories and are checked against the installed system fonts; Recent uses the system clock icon.
        Category icons and full labels switch immediately without the button title fade. Full-range sliding selection, haptic feedback, accessible category names and the original scroll position are preserved. Supports iPhone and iPad from iOS 17.

        Download **IPAKeyboard-unsigned.ipa** directly; sign both app and extension before installing.

        All four application validation jobs passed on iOS 17 and iOS 26 iPhone/iPad simulators. Physical-device performance may differ.
        Validation and IPA: https://github.com/$GITHUB_REPOSITORY/actions/runs/$VALIDATION_RUN
        Publication: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
        This GitHub release does not automatically replace the App Store version.
        NOTES
        tag="v$(cat VERSION)"
        if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          # Keep a published tag immutable. Replacement artifacts must still
          # describe exactly the same application as that published commit.
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)
          git diff --exit-code "$sha" HEAD -- App Shared KeyboardExtension IPAKeyboard.xcodeproj VERSION tools/generate_project.py tools/build_catalog.py 'Tests/*.swift'
          gh release upload "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file build/RELEASE.md
        else
          gh release create "$tag" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ipa+ keyboard $tag" --notes-file build/RELEASE.md
        fi
