name: iOS build and unsigned IPA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show build environment
        run: |
          xcodebuild -version
          swift --version
      - name: Validate catalog and project references
        run: python3 -m unittest discover -s Tests -p 'test_*.py' -v
      - name: Create a compatible iPhone simulator
        run: python3 tools/create_simulator.py
      - name: Boot the selected simulator
        run: |
          python3 - <<'PYCODE'
          import os, subprocess
          device = os.environ['SIMULATOR_ID']
          for attempt in range(2):
              try:
                  subprocess.run(['xcrun', 'simctl', 'boot', device], check=True, timeout=60)
                  subprocess.run(['xcrun', 'simctl', 'bootstatus', device, '-b'], check=True, timeout=180)
                  break
              except (subprocess.TimeoutExpired, subprocess.CalledProcessError):
                  if attempt == 1:
                      raise
                  print('Simulator boot stalled; restarting once.', flush=True)
                  subprocess.run(['xcrun', 'simctl', 'shutdown', device], timeout=30)
          PYCODE
          xcrun simctl status_bar "$SIMULATOR_ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
      - name: Compile and run XCTest on simulator
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project IPAKeyboard.xcodeproj -scheme IPAKeyboard \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -parallel-testing-enabled NO \
            -derivedDataPath build/Simulator \
            -resultBundlePath build/Tests.xcresult \
            test CODE_SIGNING_ALLOWED=NO | tee build/simulator.log
      - name: Archive for physical iPhone and iPad without signing
        run: |
          set -o pipefail
          xcodebuild -project IPAKeyboard.xcodeproj -scheme IPAKeyboard \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/IPAKeyboard.xcarchive \
            archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            | tee build/archive.log
      - name: Package unsigned IPA and verify extension
        run: |
          python3 tools/package_unsigned_ipa.py build/IPAKeyboard.xcarchive build/IPAKeyboard-unsigned.ipa
          shasum -a 256 build/IPAKeyboard-unsigned.ipa > build/SHA256SUMS.txt
          cat > build/INSTALL-NOTE.txt <<'EOF'
          This IPA is UNSIGNED and cannot be installed directly.
          Sign both IPAKeyboard.app and PlugIns/IPAKeyboardExtension.appex with compatible identifiers, entitlements, and provisioning profiles.
          No Apple certificates or provisioning profiles are included.
          After installation: Settings > General > Keyboard > Keyboards > Add New Keyboard > IPA Keyboard.
          Basic input and read-only preference sync do not require Full Access. Keyboard click audio does.
          Preserve the same App Group entitlement and IPASettingsAppGroup Info.plist identifier in the app and extension when re-signing.
          EOF
      - name: Capture system and custom keyboards on the same device
        run: |
          mkdir -p build/screenshots
          xcrun simctl install "$SIMULATOR_ID" build/Simulator/Build/Products/Debug-iphonesimulator/IPAKeyboard.app
          xcrun simctl terminate "$SIMULATOR_ID" org.example.IPAKeyboard || true
          xcrun simctl launch "$SIMULATOR_ID" org.example.IPAKeyboard --screenshot --reference-keyboard
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/keyboard-system.png
          xcrun simctl terminate "$SIMULATOR_ID" org.example.IPAKeyboard
          xcrun simctl launch "$SIMULATOR_ID" org.example.IPAKeyboard --screenshot
          sleep 3
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/keyboard-ipa.png
          xcrun simctl terminate "$SIMULATOR_ID" org.example.IPAKeyboard
          xcrun simctl launch "$SIMULATOR_ID" org.example.IPAKeyboard --screenshot --screenshot-popup
          sleep 2
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/keyboard-longpress.png
          xcrun simctl ui "$SIMULATOR_ID" appearance dark
          xcrun simctl terminate "$SIMULATOR_ID" org.example.IPAKeyboard
          xcrun simctl launch "$SIMULATOR_ID" org.example.IPAKeyboard --screenshot --screenshot-popup
          sleep 2
          xcrun simctl io "$SIMULATOR_ID" screenshot build/screenshots/keyboard-dark.png
      - name: Publish IPA directly as a release asset
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(cat VERSION)"
          cat > build/RELEASE.md <<EOF
          IPA Keyboard. Tested on iOS $TEST_IOS_VERSION.

          Download **IPAKeyboard-unsigned.ipa** below directly. No outer ZIP is needed.
          This is an UNSIGNED device IPA. Sign the app and its keyboard extension before installing.

          Text-only search key with a softer dark appearance. Streamlined settings and symbol reference pages.
          Symbol details support text selection, with direct actions to copy symbols or descriptions.

          Source: $GITHUB_SHA
          Validation: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh release create "$tag" build/IPAKeyboard-unsigned.ipa build/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "IPA Keyboard $tag" \
            --notes-file build/RELEASE.md --prerelease
      - name: Export screenshot attachments even if a test fails
        if: always()
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/test-attachments
          fi
      - name: Upload build and test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-diagnostics-${{ github.run_number }}
          path: |
            build/*.log
            build/Tests.xcresult
            build/screenshots/
            build/test-attachments/
          if-no-files-found: ignore
          retention-days: 7
